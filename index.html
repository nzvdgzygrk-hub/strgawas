<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strgawas</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:#08111f;color:#eef6ff;padding:16px}main{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{margin:0;font-size:34px}.sub{color:#9eb0c7;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#101c2e;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;box-shadow:0 14px 30px rgba(0,0,0,.25)}.full{grid-column:1/-1}.label{color:#9eb0c7;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;font-weight:800;margin-top:8px}.small{color:#9eb0c7;font-size:13px;margin-top:6px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label span{display:block;color:#9eb0c7;font-size:12px;margin-bottom:5px}input{width:100%;box-sizing:border-box;background:#07111f;color:#eef6ff;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;font-size:16px}button{border:0;border-radius:14px;padding:12px 14px;font-weight:800;color:white;background:#347cff;margin-top:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid rgba(255,255,255,.12);padding:10px 5px;text-align:left}td:last-child,th:last-child{text-align:right}.ok{color:#31d07d}.bad{color:#ff5f6d}.note{background:#1b2a3f;border-radius:16px;padding:12px;margin-top:12px;color:#ffe6a3}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.full{grid-column:1}.top{display:block}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>strgawas</h1><p class="sub">Strom und Gas Kostenwächter</p></div><p class="sub" id="datum"></p></div>
<section class="grid">
<div class="card"><div class="label">Strom pro Jahr</div><div class="value" id="stromJahr"></div><div class="small" id="stromInfo"></div></div>
<div class="card"><div class="label">Gas pro Jahr</div><div class="value" id="gasJahr"></div><div class="small" id="gasInfo"></div></div>
<div class="card full"><div class="label">Gesamt pro Jahr</div><div class="value" id="gesamtJahr"></div><div class="small" id="gesamtMonat"></div></div>
<div class="card full"><h2>Kündigungs-Check</h2><div class="value" id="frist"></div><div class="small">Start 01.07.2026 · Preisgarantie 1 Jahr · Kündigungsfrist 1 Monat</div></div>
<div class="card"><h2>Aktuell Strom</h2><div class="form"><label><span>kWh/Jahr</span><input id="stromV" type="number"></label><label><span>ct/kWh</span><input id="stromP" type="number" step="0.01"></label><label><span>Grundpreis €/Jahr</span><input id="stromG" type="number" step="0.01"></label><label><span>Bonus €</span><input id="stromB" type="number" step="0.01"></label></div></div>
<div class="card"><h2>Aktuell Gas</h2><div class="form"><label><span>kWh/Jahr</span><input id="gasV" type="number"></label><label><span>ct/kWh</span><input id="gasP" type="number" step="0.01"></label><label><span>Grundpreis €/Jahr</span><input id="gasG" type="number" step="0.01"></label><label><span>Bonus €</span><input id="gasB" type="number" step="0.01"></label></div></div>
<div class="card full"><h2>Neues Angebot</h2><div class="form"><label><span>Strom ct/kWh</span><input id="nStromP" type="number" step="0.01"></label><label><span>Strom Grundpreis</span><input id="nStromG" type="number" step="0.01"></label><label><span>Strom Bonus</span><input id="nStromB" type="number" step="0.01"></label><label><span>Gas ct/kWh</span><input id="nGasP" type="number" step="0.01"></label><label><span>Gas Grundpreis</span><input id="nGasG" type="number" step="0.01"></label><label><span>Gas Bonus</span><input id="nGasB" type="number" step="0.01"></label></div><button onclick="save()">Speichern</button> <button onclick="resetApp()">Zurücksetzen</button><div class="note" id="note"></div><table><thead><tr><th>Bereich</th><th>Aktuell</th><th>Neu</th><th>Differenz</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>
<script>
const d={stromV:4500,stromP:35,stromG:154.80,stromB:349,gasV:18000,gasP:10.86,gasG:262.80,gasB:290,nStromP:'',nStromG:'',nStromB:'',nGasP:'',nGasG:'',nGasB:''};
const ids=Object.keys(d);const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);const val=id=>parseFloat(document.getElementById(id).value)||0;const has=id=>document.getElementById(id).value.trim()!=='';function cost(v,p,g,b){return v*p/100+g-b}function load(){let s=JSON.parse(localStorage.getItem('strgawas')||'{}');let x={...d,...s};ids.forEach(id=>document.getElementById(id).value=x[id]);render()}function save(){let x={};ids.forEach(id=>x[id]=document.getElementById(id).value);localStorage.setItem('strgawas',JSON.stringify(x));render()}function resetApp(){localStorage.removeItem('strgawas');load()}function render(){datum.textContent=new Date().toLocaleDateString('de-DE');let st=cost(val('stromV'),val('stromP'),val('stromG'),val('stromB'));let ga=cost(val('gasV'),val('gasP'),val('gasG'),val('gasB'));let sum=st+ga;stromJahr.textContent=eur(st);gasJahr.textContent=eur(ga);gesamtJahr.textContent=eur(sum);gesamtMonat.textContent=eur(sum/12)+' pro Monat';stromInfo.textContent=val('stromV').toLocaleString('de-DE')+' kWh · '+val('stromP')+' ct/kWh';gasInfo.textContent=val('gasV').toLocaleString('de-DE')+' kWh · '+val('gasP')+' ct/kWh';let kuend=new Date('2027-05-30');let tage=Math.ceil((kuend-new Date())/86400000);frist.textContent=tage+' Tage bis ca. Kündigungsfrist';let ns=null,ng=null;if(has('nStromP')||has('nStromG')||has('nStromB'))ns=cost(val('stromV'),val('nStromP'),val('nStromG'),val('nStromB'));if(has('nGasP')||has('nGasG')||has('nGasB'))ng=cost(val('gasV'),val('nGasP'),val('nGasG'),val('nGasB'));let neu=(ns===null?st:ns)+(ng===null?ga:ng);let dif=(ns===null&&ng===null)?null:neu-sum;let arr=[['Strom',st,ns,ns===null?null:ns-st],['Gas',ga,ng,ng===null?null:ng-ga],['Gesamt',sum,dif===null?null:neu,dif]];rows.innerHTML=arr.map(r=>'<tr><td>'+r[0]+'</td><td>'+eur(r[1])+'</td><td>'+(r[2]===null?'–':eur(r[2]))+'</td><td class="'+(r[3]<0?'ok':r[3]>0?'bad':'')+'">'+(r[3]===null?'–':eur(r[3]))+'</td></tr>').join('');note.textContent=dif===null?'Neues Angebot eintragen, dann wird verglichen.':dif<0?'Wechsel spart '+eur(Math.abs(dif))+' pro Jahr.':dif>0?'Neues Angebot kostet '+eur(dif)+' mehr pro Jahr.':'Gleich teuer.'}ids.forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id)render()}));load();
</script>
</body>
</html>
